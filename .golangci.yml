# golangci-lint configuration, v2 schema.
#
# Kept in step with the golangci-lint-action@v9 pin in .github/workflows/ci.yml.
# Action v7 and later drive golangci-lint v2 only, and v9 is the first that runs on
# Node 24 rather than the Node 20 that GitHub has deprecated. Changing either of the
# two means checking the other: the action validates this file against the JSON schema
# for the golangci-lint version it installs, so a v1-schema file fails the run outright
# rather than being ignored.
#
# The bar here is "find me a bug", not "make the code look like everyone else's". A lint
# job that reports thirty things nobody intends to act on is a job people learn to skip,
# and then it catches nothing when it finally has something worth saying. So the set
# below is deliberately narrow, and every exclusion says why.
version: "2"

linters:
  default: standard

  disable:
    # errcheck insists every returned error is handled. Most of what it finds here is
    # `defer f.Close()` in a test, `fmt.Fprintf` to an http.ResponseWriter in an example,
    # and `binary.Write` to a bytes.Buffer, none of which have a failure a caller could
    # do anything about. Rewriting those to satisfy the linter makes teaching code noisier
    # and test teardown longer without making anything more correct.
    #
    # This is not a claim that dropped errors never matter. It is a claim that a check
    # with this hit rate cannot tell the two apart, so it belongs in review rather than in
    # a gate. The errors that do matter here are the ones on the signing and verification
    # paths, and those are covered by the tests rather than by a linter.
    - errcheck

  settings:
    staticcheck:
      # staticcheck ships four families and only one of them finds bugs.
      #
      #   SA  - correctness: deprecated APIs, unreachable branches, values computed and
      #         then thrown away. This is the family worth failing a build over, and it
      #         has already earned its place here: SA1019 caught a deprecated crypto API
      #         in jwk.go and SA4020 caught a dead case clause in validators.go.
      #   S1  - simplifications. Actively unwanted. This package writes deliberately
      #         awkward code on the hot paths for speed, and a linter that keeps proposing
      #         the tidier form is a linter that will eventually be obeyed by mistake.
      #   ST1 - naming and comment style. Opinion, not correctness.
      #   QF1 - quickfix refactors. Opinion, not correctness.
      checks:
        - all
        - -S1*
        - -ST1*
        - -QF1*

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # `json:"field,required"` is this package's own tag convention, read by
      # HasRequiredJSONTag and meetRequirements in required.go. encoding/json ignores the
      # option, which is exactly what makes the trick work, and staticcheck is right that
      # the option is unknown to encoding/json - it just does not know the option is ours.
      # Removing it would break a documented, exported feature.
      - linters:
          - staticcheck
        text: "SA5008: invalid appearance of unknown `required` tag option"

    paths:
      # Both are separate modules with their own go.mod, and both begin with an
      # underscore, so `go build ./...` and this linter already skip them. Listed anyway
      # so that running golangci-lint from the repository root with an explicit path
      # cannot pull them in with the wrong module context.
      - _examples
      - _benchmarks
      - third_party$
      - builtin$
      - examples$

formatters:
  # Formatting is checked by the `gofmt -l .` step in CI, which covers every module in
  # the tree rather than only the one being linted. Enabling a formatter here as well
  # would mean two places to fix the same complaint.
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
